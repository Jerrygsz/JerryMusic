name: Build JerryMusic Android APK

on:
  push:
    branches: [main, feature/android-apk, feature/player-core-ux, feature/lyrics-system, fix/android-all-buttons-unresponsive, fix/navigation-queryselector-crash]
  pull_request:
    branches: [main, feature/android-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check patch whitespace
        run: git diff --check

      - name: Validate JavaScript syntax
        run: |
          node --input-type=module --check < www/app.js
          node --input-type=module --check < www/lyrics.js
          cp www/lyrics.js /tmp/jerrymusic-lyrics.mjs
          node --input-type=module -e "import('file:///tmp/jerrymusic-lyrics.mjs').then(({parseLrc}) => { const lines = parseLrc('[offset:+500]\\n[00:01.25]one\\n[00:02.50][00:03.00]two'); const times = lines.map(x => x.time); if (lines.length !== 3 || times.some((x,i) => Math.abs(x - [1.75,3,3.5][i]) > 0.001)) process.exit(1); console.log('LRC parser smoke test passed'); })"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build local music bridge
        run: |
          npm run build:bridge
          test -s www/local-music-bridge.js
          grep -q 'local-music-bridge.js' www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Register native local music plugin
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JerryMusic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
